<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InvoiceApp</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="logo">
                    <a href="index.html" style="text-decoration: none; color: inherit;"><h1>InvoiceApp</h1></a>
                </div>
                <div class="nav-links">
                    <a href="register.html">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Login</h2>
            <p>Sign in to your account</p>
            
            <div id="alert-container"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Login</button>
                </div>
            </form>
            
            <div class="auth-link">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
            
            <div style="margin-top: 1.5rem; padding: 1rem; background: #f0f0f0; border-radius: 5px; font-size: 0.9rem; color: #666;">
                <strong>Default Admin Login:</strong><br>
                Email: admin@invoiceapp.com<br>
                Password: admin123
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            
            await loginUser(formData);
        });
    </script>
</body>
</html>
