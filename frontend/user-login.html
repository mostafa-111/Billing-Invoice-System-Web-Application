<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - InvoiceApp</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .user-badge {
            display: inline-block;
            background: linear-gradient(135deg, #06B6D4 0%, #0D9488 100%);
            color: white;
            padding: 0.625rem 1.25rem;
            border-radius: 2rem;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            letter-spacing: 0.5px;
        }
        .auth-card {
            border-top: 4px solid #06B6D4;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="logo">
                    <a href="index.html" style="text-decoration: none; color: inherit;"><h1>InvoiceApp</h1></a>
                </div>
                <div class="nav-links">
                    <a href="admin-login.html">Admin Login</a>
                    <a href="register.html">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="user-badge">👤 USER ACCESS</div>
            <h2>User Login</h2>
            <p>Sign in to manage your invoices</p>
            
            <div id="alert-container"></div>
            
            <form id="user-login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-input-container">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="password-toggle" id="password-toggle" aria-label="Toggle password visibility">
                            👁️
                        </button>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Login</button>
                </div>
            </form>
            
            <div class="auth-link">
                Don't have an account? <a href="register.html">Register here</a> | 
                <a href="admin-login.html">Admin Login</a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Password visibility toggle function
        function togglePasswordVisibility(inputId, buttonId) {
            const input = document.getElementById(inputId);
            const button = document.getElementById(buttonId);

            if (input.type === 'password') {
                input.type = 'text';
                button.textContent = '🙈'; // Closed eye when visible
                button.setAttribute('aria-label', 'Hide password');
            } else {
                input.type = 'password';
                button.textContent = '👁️'; // Open eye when hidden
                button.setAttribute('aria-label', 'Show password');
            }
        }

        // Initialize password toggle
        document.addEventListener('DOMContentLoaded', () => {
            const passwordToggle = document.getElementById('password-toggle');
            if (passwordToggle) {
                passwordToggle.addEventListener('click', () => {
                    togglePasswordVisibility('password', 'password-toggle');
                });
            }
        });
        document.getElementById('user-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            
            try {
                const response = await apiRequest(API_ENDPOINTS.auth.login, {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });
                
                if (response.success) {
                    // Check if user is admin trying to use user login
                    if (response.data.user.role === 'admin') {
                        showAlert('You are an admin. Please use the admin login page.', 'error');
                        setTimeout(() => {
                            window.location.href = 'admin-login.html';
                        }, 2000);
                        return;
                    }
                    
                    setAuthData(response.data.token, response.data.user);
                    showAlert('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                }
            } catch (error) {
                showAlert(error.message || 'Login failed. Please check your credentials.', 'error');
            }
        });
    </script>
</body>
</html>
