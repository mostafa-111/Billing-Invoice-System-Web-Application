<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container" style="max-width: 800px; margin: 50px auto; padding: 20px;">
        <h1>API Connection Test</h1>

        <div id="alert-container"></div>

        <div style="margin: 20px 0;">
            <h3>Test API Connection</h3>
            <button onclick="testConnection()" class="btn-primary">Test Connection</button>
            <button onclick="testLogin()" class="btn-secondary">Test Login</button>
            <button onclick="testUsers()" class="btn-secondary">Test Users API</button>
        </div>

        <div id="results" style="background: #f5f5f5; padding: 15px; border-radius: 5px; font-family: monospace; white-space: pre-wrap;"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>

    <script>
        function log(message) {
            const results = document.getElementById('results');
            results.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
            console.log(message);
        }

        async function testConnection() {
            log('Testing basic API connection...');
            try {
                const response = await fetch('http://localhost:5000/api/');
                const data = await response.text();
                log('API Status: ' + response.status);
                log('Response: ' + data);
            } catch (error) {
                log('Connection failed: ' + error.message);
            }
        }

        async function testLogin() {
            log('Testing login...');
            try {
                const response = await apiRequest(API_ENDPOINTS.auth.login, {
                    method: 'POST',
                    body: JSON.stringify({
                        email: 'admin@invoiceapp.com',
                        password: 'admin123'
                    })
                });

                if (response.success) {
                    log('Login successful!');
                    log('Token: ' + response.data.token.substring(0, 20) + '...');
                    log('User: ' + response.data.user.name + ' (' + response.data.user.role + ')');

                    // Store the token for subsequent tests
                    localStorage.setItem('token', response.data.token);
                    localStorage.setItem('user', JSON.stringify(response.data.user));
                } else {
                    log('Login failed: ' + response.message);
                }
            } catch (error) {
                log('Login error: ' + error.message);
            }
        }

        async function testUsers() {
            log('Testing users API...');
            log('Token exists: ' + !!getAuthToken());

            try {
                const response = await apiRequest(API_ENDPOINTS.users.list);
                log('Users API Status: ' + (response.success ? 'Success' : 'Failed'));

                if (response.success) {
                    log('Users found: ' + response.data.users.length);
                    response.data.users.forEach(user => {
                        log('  - ' + user.name + ' (' + user.email + ') - ' + user.role);
                    });
                } else {
                    log('Error: ' + response.message);
                }
            } catch (error) {
                log('Users API error: ' + error.message);
            }
        }

        // Auto-test on page load
        window.onload = function() {
            log('API Test Page Loaded');
            log('Frontend URL: ' + window.location.href);
            log('API Base URL: ' + API_BASE_URL);
        };
    </script>
</body>
</html>
